# ============================================================================
# HEALTHY FOOD NHA TRANG — стоп-лист красной зоны
# Дата: 18.07.2026
#
# Источник требований: HF_Handoff_Context.md, раздел 5.
#   "Красная зона — отдельный классификатор на входе, до генерации ответа"
#   "Асимметричный порог: ложная эскалация бесплатна, пропуск — цена здоровья"
#   "Стоп-лист терминов поверх ИИ: аллерг*, непереноси*, диабет, беременн*,
#    лекарств*, орех, глютен, лактоз*"
#
# ВАЖНО: этот файл — первый (детерминированный) слой защиты. Он ловит
# сообщения, где нужное слово присутствует в любой словоформе/опечатке.
# Он НЕ ловит полный перифраз без ключевых слов (см. red_zone_classifier.py,
# секция "Известное ограничение" — там же обоснование, почему это не баг).
#
# Формат: каждый паттерн — regex-фрагмент (без \b, добавляется в коде).
# "*" в комментариях — человеко-понятная заметка, сам матчинг идёт по regex.
# ============================================================================

# --- 1. Аллергии и медицинские ограничения -> ВСЕГДА эскалация, без исключений
allergy_medical:
  ru:
    - "ал+ерг\\w*"          # аллергия/алергия (частая опечатка — одна "л"), аллергик...
    - "непереноси\\w*"      # непереносимость, непереносим...
    - "диабет\\w*"
    - "беременн\\w*"
    - "лекарств\\w*"
    - "медикамент\\w*"
    - "орех\\w*"            # орех, орехи, ореховый (миндаль/фундук см. отдельно)
    - "миндал\\w*"
    - "фундук\\w*"
    - "арахис\\w*"
    - "глютен\\w*"
    - "лактоз\\w*"
    - "безглютенов\\w*"
    - "безлактозн\\w*"
    - "б/г"                 # частое сокращение "без глютена" в переписках
    - "б/л"                 # частое сокращение "без лактозы"
    - "морепродукт\\w*"     # тоже может быть аллергия, не только предпочтение
    - "молок\\w*"           # молоко/молочка — часто фигурирует при непереносимости, требует контекста
    - "лактаз\\w*"
    - "целиаки\\w*"
    - "анафилакс\\w*"
    - "отёк\\w*"            # отёк Квинке и т.п. — экстренный медицинский сигнал
    - "отек\\w*"
    - "скорая\\w*"
    - "госпитал\\w*"
    - "больниц\\w*"
    - "рвот\\w*"
    - "тошнит\\w*"
    - "температур\\w*"
    - "сыпь\\w*"
    - "задыха\\w*"
  fr:
    - "al+erg\\w*"          # allergie/alergie (opechatka frequente)
    - "intoléran\\w*"
    - "diabèt\\w*"
    - "enceinte"
    - "grossesse"
    - "médicament\\w*"
    - "noix"
    - "arachide\\w*"
    - "gluten"
    - "lactose"
    - "sans gluten"
    - "sans lactose"
  en:
    - "al+erg\\w*"          # allergy/alergy (common typo)
    - "intoleran\\w*"
    - "diabet\\w*"
    - "pregnan\\w*"
    - "medicat\\w*"
    - "medicine"
    - "nut\\w*"
    - "peanut\\w*"
    - "gluten"
    - "lactose"
    - "gluten[- ]free"
    - "dairy[- ]free"

# --- 2. Косвенные/неявные сигналы (пример из handoff: "у сына вроде на орехи
#     что-то было, ничего?" — без слова "аллергия", без негативного тона)
#     Эти фразы-шаблоны не заменяют слово-триггер выше, а расширяют покрытие
#     на типовые непрямые формулировки про здоровье третьих лиц (дети).
indirect_patterns:
  ru:
    - "что-то\\s+было\\s+на"     # "...на орехи что-то было..."
    - "реаг\\w*\\s+на"            # "плохо реагирует на..."
    - "нельзя\\s+ему"
    - "нельзя\\s+ей"
    - "плохо\\s+станет"
    - "плохо\\s+будет\\s+от"

# --- 3. Жалобы / негативный тон -> тоже ВСЕГДА эскалация (принцип 3 из ТЗ)
#     Отдельная категория от здоровья: другой acceptance-критерий (S7:
#     "нет жалоб на навязчивость"), но тот же результат — эскалация человеку.
complaint_negative:
  ru:
    - "жалоб\\w*"
    - "недовол\\w*"
    - "ужасн\\w*"
    - "отвратительн\\w*"
    - "испортил\\w*"
    - "испортил\\w*ся"
    - "отрав\\w*"           # отравил/отравление/отравлением — жалоба ИЛИ клиент
                            # сообщает, что заболел (найдено на реальных
                            # переписках 20.07.2026, "слегла с отравлением"
                            # не ловилось старым "отравил\w*")
    - "верните\\s+деньги"
    - "возврат\\w*\\s+денег"
    - "обман\\w*"
    - "развод\\w*"          # разговорное "развели на деньги"
    - "требую\\w*"
    - "разочарован\\w*"
    - "больше\\s+не\\s+буду"
    - "отменяю\\s+навсегда"
    - "плохое\\s+качество"
    - "невкусн\\w*"
  fr:
    - "plainte\\w*"
    - "mécontent\\w*"
    - "horrible"
    - "remboursement\\w*"
    - "arnaque\\w*"
  en:
    - "complain\\w*"
    - "refund\\w*"
    - "terrible"
    - "scam\\w*"
    - "disappoint\\w*"

# --- 4. Тон-сигналы без ключевых слов (эвристика, не regex-термин) ---------
# Обрабатываются отдельно в коде, не через паттерн-матчинг:
#   - доля заглавных букв в сообщении > 60% при длине > 10 символов
#   - 3+ восклицательных/вопросительных знака подряд ("???", "!!!")
#   - сообщение состоит только из эмодзи гнева/грусти (😡😠🤬😢💔)
tone_heuristics:
  caps_ratio_threshold: 0.6
  min_length_for_caps_check: 10
  repeated_punctuation_pattern: "[!?]{3,}"
  negative_emoji:
    - "😡"
    - "😠"
    - "🤬"
    - "😢"
    - "💔"
    - "🤢"
